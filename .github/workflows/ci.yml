name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

#      - name: Run tests
#        run: uv run pytest

      - name: Collect quality metrics
        run: |
          echo "## Quality Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 1. Lint errors" >> "$GITHUB_STEP_SUMMARY"
          LINT_ERRORS=$(uv run ruff check . --output-format=json 2>/dev/null | python -c "import json, sys; print(len(json.load(sys.stdin)))")
          echo "Ruff errors: **$LINT_ERRORS**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 2. Cyclomatic complexity" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          uv run radon cc . -s >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 3. Commit frequency" >> "$GITHUB_STEP_SUMMARY"
          COMMITS=$(git rev-list --count --since="30 days ago" HEAD)
          echo "Commits during last 30 days: **$COMMITS**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 4. Commit size" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          git diff --shortstat HEAD~1 HEAD || true
          git diff --shortstat HEAD~1 HEAD >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### 5. Pipeline duration" >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline duration is provided by GitHub Actions for this workflow run." >> "$GITHUB_STEP_SUMMARY"